# Site estático: sem build, publica a pasta public/
[build]
  publish = "public"

# www → domínio principal
[[redirects]]
  from = "https://www.datalumeinsight.com.br/*"
  to = "https://datalumeinsight.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
